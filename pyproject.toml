[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ec-deim"
version = "0.1.0"
description = "Evidence-conditioned DEIM training for AI City Challenge 2026 Track 6"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Zili Jia"},
  {name = "Jingyi Wang"},
  {name = "Yingjie Zou"},
  {name = "Li Li"},
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
]

[tool.setuptools.packages.find]
include = ["ecdeim*"]

[tool.ruff]
line-length = 100
target-version = "py310"
