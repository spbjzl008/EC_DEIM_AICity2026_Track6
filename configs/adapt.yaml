stage: adapt

model:
  base_config: configs/deim_dfine/dfine_hgnetv2_x_coco.yml
  deim_revision: 09d35d53d39ee3145a1e61e3a989b28b9468d1dd
  num_classes: 10
  image_size: 896
  sync_bn: false
  find_unused_parameters: true

training:
  epochs: 16
  flat_epochs: 8
  no_aug_epochs: 2
  collate_stop_epoch: 14
  full_image_training: true
  use_ema: true
  micro_batch_per_gpu: 3
  gradient_accumulation_steps: 10
  workers_per_gpu: 2
  warmup_iterations: 500
  checkpoint_frequency: 1
  print_frequency: 100
  ema_restart_decay: 0.9998
  lr_gamma: 0.5

optimizer:
  class_head_lr: 0.00005
  box_lr: 0.00002
  decoder_lr: 0.000014
  weight_decay: 0.000125

augmentation:
  profile: oadc_plus_deim_native_light
  policy_epochs: [2, 6, 12]
  native_stage_probability: 0.5
  base_size_repeat: 3
  mixup_probability: 0.5
  mixup_epochs: [0, 2]
  oadc:
    max_probability: 0.30
    constant_until_epoch: 4
    zero_at_epoch: 8
    background_strength: [0.45, 0.75]
    object_strength: [0.03, 0.12]
    small_object_strength: [0.00, 0.04]
    small_object_area_ratio: 0.0021
    box_padding_ratio: 0.16
    feather_ratio: 0.10

adaptation:
  freeze_backbone: true
  lora:
    enabled: true
    rank: 8
    alpha: 16
  head_calibration:
    enabled: true
    single_truck_bias: -2.0
    restart_classes:
      - Vehicle.Heavy Duty Vehicle
      - Vehicle.Trailer
